<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나를 알아보는 성격유형 탐험 · 진로 활동</title>
<style>
:root{
  /* Clay 디자인 시스템 팔레트 — 크림 캔버스 + 잉크 블랙 CTA + 채도 높은 단색 카드 */
  --ink:#0a0a0a; --body-c:#3a3a3a; --sub:#6a6a6a; --line:#e5e5e5;
  --bg:#fffaf0; --card:#ffffff; --surface-soft:#faf5e8; --surface-card:#f5f0e0;
  --warn:#f59e0b; --warn-bg:#fff6e0; --warn-ink:#92400e;
  --pink:#ff4d8b; --teal:#1a3a3a; --lavender:#b8a4ed; --peach:#ffb084;
  --ochre:#e8b94a; --mint:#a4d4c5; --coral:#ff6b5a;
  --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Nanum Gothic",sans-serif;
  background:var(--bg); color:var(--body-c); line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px; margin:0 auto; padding:20px 16px 60px;}
.card{background:var(--card); border-radius:var(--radius); padding:24px 22px;
      box-shadow:0 1px 2px rgba(10,10,10,.06);}
h1{font-size:27px; margin:0 0 6px; letter-spacing:-.6px; line-height:1.3; color:var(--ink);}
h2{font-size:20px; margin:0 0 10px; letter-spacing:-.4px; color:var(--ink);}
h3{font-size:16px; margin:22px 0 8px; color:var(--ink); letter-spacing:-.2px; font-weight:700;}
p{margin:0 0 12px;}
.lead{color:var(--sub); font-size:15px;}
.hidden{display:none !important;}

/* 안내 배너 — 각주가 아니라 본문으로. disc(결과 화면)와 같은 경고색을 써서
   "정식 검사 아님" 메시지가 어느 화면에서나 같은 신호로 읽히게 한다 */
.notice{background:var(--warn-bg); border:1.5px solid var(--warn); color:var(--warn-ink);
        border-radius:14px; padding:13px 15px; font-size:14px; margin:18px 0;}
.notice b{color:#7c2d12;}

/* 시작 화면 */
.hero-emoji{font-size:52px; line-height:1; margin-bottom:10px;}
.namebox{margin:20px 0 6px;}
.namebox label{display:block; font-size:14px; color:var(--sub); margin-bottom:6px;}
.namebox input{width:100%; font-size:18px; padding:13px 15px; border:1.5px solid var(--line);
               border-radius:12px; font-family:inherit; background:#fff; color:var(--ink);}
.namebox input:focus{outline:none; border-color:var(--ink); background:#fff;}
.namehint{font-size:12.5px; color:var(--sub); margin-top:7px;}

.btn{display:block; width:100%; border:none; border-radius:14px; padding:16px;
     font-size:18px; font-weight:700; font-family:inherit; cursor:pointer;
     background:var(--ink); color:#fff; transition:transform .06s, filter .15s;}
.btn:active{transform:scale(.985);}
.btn.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--ink);}
.btn.sub{background:var(--surface-card); color:var(--body-c); font-size:15px; padding:12px;}
.btnrow{display:flex; gap:10px; margin-top:12px;}
.btnrow .btn{margin:0;}

/* 문항 화면 */
.progwrap{margin-bottom:18px;}
.progtop{display:flex; justify-content:space-between; font-size:13px; color:var(--sub); margin-bottom:7px;}
.progbar{height:9px; background:var(--line); border-radius:99px; overflow:hidden;}
.progfill{height:100%; width:0%; background:var(--ink);
          border-radius:99px; transition:width .3s ease;}
.qnum{display:inline-block; background:var(--peach); color:var(--ink); font-weight:800;
      font-size:13px; padding:4px 12px; border-radius:99px; margin-bottom:12px;}
.qtext{font-size:22px; font-weight:700; line-height:1.45; margin:0 0 20px; letter-spacing:-.4px; color:var(--ink);}
.choice{display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left;
        background:#fff; border:2px solid var(--line); border-radius:14px;
        padding:17px 16px; font-size:17px; font-family:inherit; color:var(--ink);
        cursor:pointer; margin-bottom:11px; line-height:1.45; transition:.12s;}
.choice:hover{border-color:var(--ink); background:var(--surface-soft);}
.choice:active{transform:scale(.99);}
.choice .tag{flex:0 0 auto; width:27px; height:27px; border-radius:8px; background:var(--surface-card);
             color:var(--ink); font-weight:800; font-size:14px; display:flex;
             align-items:center; justify-content:center; margin-top:1px;}
.backlink{margin-top:16px; text-align:center;}
.backlink button{background:none; border:none; color:var(--sub); font-size:14px;
                 font-family:inherit; cursor:pointer; text-decoration:underline; padding:8px;}

/* 결과 화면 */
.typebadge{display:inline-block; background:var(--ink); color:#fff; font-weight:800;
           font-size:15px; letter-spacing:2px; padding:6px 16px; border-radius:99px;}
.nick{font-size:29px; font-weight:800; margin:12px 0 8px; letter-spacing:-.7px; line-height:1.3; color:var(--ink);}
.typedesc{font-size:16.5px; color:var(--body-c);}
/* 결과지는 집으로 나가는 유일한 산출물이라, 고지 문구를 화면과 인쇄 양쪽 본문에 둔다.
   notice(시작 화면)와 같은 warn 톤을 써서 같은 메시지가 같은 색으로 읽히게 한다 */
.disc{border:1.3px solid var(--warn); background:var(--warn-bg); color:var(--warn-ink);
      border-radius:11px; padding:8px 12px; font-size:13.5px;
      text-align:center; margin:11px 0 15px;}

.axisrow{margin:9px 0;}
.axislabels{display:flex; justify-content:space-between; font-size:13px; color:var(--sub); margin-bottom:4px;}
.axislabels b{color:var(--ink);}
.axisbar{display:flex; height:12px; border-radius:99px; overflow:hidden; background:var(--line);}
.axisbar span{display:block;}
.axisbar .win{background:var(--ink);}
.axisbar .lose{background:transparent;}
.axisside{color:var(--sub);}
.axisside.on{color:var(--ink); font-weight:700;}

ul.plain{margin:0; padding-left:20px;}
ul.plain li{margin-bottom:7px;}

/* 흥미영역 6가지에 클레이 팔레트 6색을 하나씩 배정 — 매 결과 화면에서 같은 색=같은 영역 */
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 0;}
.chip{font-size:14.5px; font-weight:600; padding:7px 13px; border-radius:12px;
      background:var(--surface-card); color:var(--ink);}
.chip.i-R{background:var(--coral); color:#fff;}
.chip.i-I{background:var(--lavender); color:var(--ink);}
.chip.i-A{background:var(--pink); color:#fff;}
.chip.i-S{background:var(--mint); color:var(--ink);}
.chip.i-E{background:var(--ochre); color:var(--ink);}
.chip.i-C{background:var(--peach); color:var(--ink);}
.chip .sm{font-weight:400; opacity:.85;}

.joblist{display:flex; flex-wrap:wrap; gap:8px;}
.job{font-size:15px; padding:8px 14px; border-radius:99px; background:var(--coral);
     color:#fff; font-weight:600;}

.todo{background:var(--surface-card); border-radius:14px; padding:14px 16px;}
.todo ul{margin:0; padding-left:19px;}
.todo li{margin-bottom:6px;}

.grow{background:var(--surface-soft); border-radius:14px; padding:14px 16px; font-size:15px; color:var(--body-c);}

.closing{margin-top:24px; background:var(--teal); border-radius:14px;
         padding:16px 17px; font-size:15px; color:#fff;}
.closing b{color:var(--peach);}

.draftbox{background:var(--warn-bg); border:1.5px solid var(--warn); border-radius:14px;
          padding:16px; color:var(--warn-ink); font-size:15px;}

/* 인쇄 전용 */
.print-only{display:none;}
.wline{border-bottom:1.4px solid #94a3b8; height:22px; margin:7px 0;}
.wline.sm{height:19px;}

@media print{
  /* A4 한 장에 들어가도록 압축 */
  @page{size:A4; margin:10mm 12mm;}
  body{background:#fff; font-size:10pt; line-height:1.3;}
  .wrap{max-width:none; padding:0;}
  .card{box-shadow:none; padding:0; border-radius:0;}
  .no-print{display:none !important;}
  .print-only{display:block;}
  p{margin:0 0 5px;}
  h1{font-size:15pt;}
  .nick{font-size:16pt; margin:5px 0 4px;}
  .typedesc{font-size:10pt;}
  .disc{border:1px solid #64748b; background:#fff; color:#000;
        font-size:9pt; padding:2px 8px; margin:3px 0 5px; border-radius:6px;}
  h3{font-size:10.5pt; margin:7px 0 3px; color:#000;
     border-bottom:1.2px solid #cbd5e1; padding-bottom:2px;}
  .typebadge{background:#fff; color:#000; border:1.2px solid #000;
             padding:2px 10px; font-size:10pt;}
  .lead{font-size:8.5pt; margin-bottom:4px;}
  ul.plain{padding-left:17px;} ul.plain li{margin-bottom:1px;}
  .axisrow{margin:3px 0;} .axislabels{font-size:8.5pt; margin-bottom:2px;}
  .axisbar{height:8px;}
  .axisbar .win{background:#334155;} .axisbar .lose{background:#e2e8f0;}
  .axisside.on{color:#000;}
  .chips,.joblist{gap:5px;}
  .job{background:#fff; border:1px solid #94a3b8; color:#000;
       padding:3px 8px; font-size:9.5pt; border-radius:8px;}
  .chip{background:#f1f5f9 !important; color:#000 !important;
        padding:3px 8px; font-size:9.5pt; border-radius:8px;}
  .todo,.grow,.closing,.notice{background:#fff; border:1px solid #cbd5e1;
        color:#000; padding:6px 9px; font-size:9.5pt; border-radius:8px;}
  .todo ul{padding-left:16px;} .todo li{margin-bottom:1px;}
  .closing{margin-top:7px;}
  /* 화면에서는 어두운 배경 위 밝은 색(peach) 글자지만, 인쇄는 흰 배경이라
     그대로 두면 흐리게 나온다 — 인쇄용은 검정으로 고정 */
  .closing b{color:#000 !important;}
  .print-only{page-break-inside:avoid; margin-top:7px !important;}
  .print-only p{font-size:9.5pt !important; margin:9px 0 3px !important;}
  .wline{height:24px; margin:6px 0;} .wline.sm{height:22px; margin:5px 0;}
  .pagebreak{page-break-before:always;}
}

@media (max-width:420px){
  h1{font-size:24px;} .qtext{font-size:20px;} .nick{font-size:25px;}
  .card{padding:20px 17px;} .choice{font-size:16px;}
}
</style>
</head>
<body>
<div class="wrap">

<!-- ============ 시작 화면 ============ -->
<section id="screen-start" class="card">
  <div class="hero-emoji">🧭</div>
  <h1>나를 알아보는<br>성격유형 탐험</h1>
  <p class="lead">스무 고개를 넘으면서 내가 어떤 사람인지, 무엇에 흥미가 있는지 찾아보는 진로 활동이에요.</p>

  <div class="notice">
    <b>잠깐, 꼭 읽어주세요.</b><br>
    이건 정식 심리검사가 아니라 <b>나를 알아보는 수업 활동</b>이에요.
    사람은 한 가지 유형으로 딱 나눠지지 않고, 자라면서 얼마든지 달라져요.
    결과는 "나는 이런 사람이구나" 하고 <b>생각해보는 힌트</b>로만 쓰면 돼요.
  </div>

  <div class="namebox">
    <label for="nameInput">이름 (결과지에 쓸 이름이에요)</label>
    <input id="nameInput" type="text" placeholder="예) 김민준" maxlength="12" autocomplete="off">
    <div class="namehint">🔒 이름은 어디에도 저장되지 않고, 이 화면과 인쇄한 종이에만 나와요.</div>
  </div>

  <button class="btn" id="btnStart" style="margin-top:16px;">탐험 시작하기 →</button>
</section>

<!-- ============ 문항 화면 ============ -->
<section id="screen-quiz" class="card hidden">
  <div class="progwrap">
    <div class="progtop"><span id="progText">1 / 20</span><span id="progPct">0%</span></div>
    <div class="progbar"><div class="progfill" id="progFill"></div></div>
  </div>
  <div class="qnum" id="qNum">1번</div>
  <p class="qtext" id="qText">질문</p>
  <button class="choice" id="choiceA"><span class="tag">가</span><span id="textA"></span></button>
  <button class="choice" id="choiceB"><span class="tag">나</span><span id="textB"></span></button>
  <div class="backlink"><button id="btnBack">← 앞 질문으로 돌아가기</button></div>
</section>

<!-- ============ 결과 화면 ============ -->
<section id="screen-result" class="card hidden">
  <div id="resultBody"></div>

  <div class="btnrow no-print" id="printRow" style="margin-top:26px;">
    <button class="btn" id="btnPrint">🖨 결과지 인쇄하기</button>
  </div>
  <div class="btnrow no-print">
    <button class="btn sub" id="btnAgain">처음부터 다시 하기</button>
  </div>
</section>

</div>

<script>
/* =========================================================
   문항 20개 — 축당 5개, 강제선택 A/B, 구체적 상황문
   axis: EI / SN / TF / JP   ·  a.v, b.v = 해당 선택의 지표
   ========================================================= */
var QUESTIONS = [
  { axis:"EI", q:"쉬는 시간에 나는",
    a:{t:"친구들이랑 우르르 모여서 논다", v:"E"},
    b:{t:"혼자 조용히 하고 싶은 걸 한다", v:"I"} },
  { axis:"SN", q:"블록이나 만들기 키트를 받으면 나는",
    a:{t:"설명서에 나온 순서대로 차근차근 만든다", v:"S"},
    b:{t:"설명서는 대충 보고 내 마음대로 바꿔 만든다", v:"N"} },
  { axis:"TF", q:"친구가 속상해서 울고 있을 때 나는",
    a:{t:"어떻게 하면 해결될지 방법을 먼저 말해준다", v:"T"},
    b:{t:"우선 마음을 알아주고 같이 속상해해 준다", v:"F"} },
  { axis:"JP", q:"방학 숙제를 나는",
    a:{t:"계획을 세워서 미리미리 해둔다", v:"J"},
    b:{t:"하고 싶어질 때 몰아서 한다", v:"P"} },

  { axis:"EI", q:"새 학년 첫날, 처음 보는 짝꿍한테 나는",
    a:{t:"내가 먼저 다가가서 말을 건다", v:"E"},
    b:{t:"말 걸어줄 때까지 조금 기다리는 편이다", v:"I"} },
  { axis:"SN", q:"선생님 설명을 들을 때 나는",
    a:{t:"정확히 뭘 어떻게 하면 되는지가 제일 궁금하다", v:"S"},
    b:{t:"왜 그런 건지, 다른 방법은 없는지가 더 궁금하다", v:"N"} },
  { axis:"TF", q:"모둠에서 한 명이 약속을 안 지켰을 때 나는",
    a:{t:"정해진 규칙대로 하는 게 맞다고 생각한다", v:"T"},
    b:{t:"무슨 사정이 있었는지 먼저 들어보고 싶다", v:"F"} },
  { axis:"JP", q:"가족 여행을 갈 때 나는",
    a:{t:"뭘 할지 미리 정해져 있으면 마음이 편하다", v:"J"},
    b:{t:"가서 그때그때 정하는 게 더 재밌다", v:"P"} },

  { axis:"EI", q:"모둠 활동에서 의견을 낼 때 나는",
    a:{t:"떠오르는 대로 말하면서 생각을 정리한다", v:"E"},
    b:{t:"머릿속으로 정리한 다음에 입을 연다", v:"I"} },
  { axis:"SN", q:"읽을 책을 고를 때 나는",
    a:{t:"실제로 있었던 일이 담긴 책이 재밌다", v:"S"},
    b:{t:"상상 속 세계가 나오는 책이 재밌다", v:"N"} },
  { axis:"TF", q:"내가 만든 작품을 보여줬을 때 더 듣고 싶은 말은",
    a:{t:"“여기를 이렇게 고치면 훨씬 좋아지겠다”", v:"T"},
    b:{t:"“이 부분 정말 멋지다, 애썼겠네”", v:"F"} },
  { axis:"JP", q:"내 책상 서랍과 사물함은",
    a:{t:"물건마다 자리를 정해두고 정리한다", v:"J"},
    b:{t:"좀 어질러져 있어도 내가 찾으면 된다", v:"P"} },

  { axis:"EI", q:"신나는 일이 생겼을 때 나는",
    a:{t:"만나는 사람마다 바로 이야기한다", v:"E"},
    b:{t:"제일 친한 한두 명한테만 이야기한다", v:"I"} },
  { axis:"SN", q:"친구가 “이거 어떻게 할까?” 하고 물으면 나는",
    a:{t:"지금 눈에 보이는 걸 그대로 알려준다", v:"S"},
    b:{t:"“이렇게 해보면 어때?” 하고 새 아이디어를 낸다", v:"N"} },
  { axis:"TF", q:"둘 중 하나를 정해야 할 때 나는",
    a:{t:"어느 쪽이 더 맞는 말인지 따져본다", v:"T"},
    b:{t:"누가 서운해지지는 않을지 먼저 살핀다", v:"F"} },
  { axis:"JP", q:"만들기 시간이 끝나갈 때 나는",
    a:{t:"조금 아쉬워도 시간 안에 꼭 끝낸다", v:"J"},
    b:{t:"더 좋게 만들 수 있으면 시간이 넘어도 괜찮다", v:"P"} },

  { axis:"EI", q:"주말에 더 하고 싶은 건",
    a:{t:"친구들이랑 밖에서 신나게 놀기", v:"E"},
    b:{t:"집에서 나만의 시간 보내기", v:"I"} },
  { axis:"SN", q:"나는 이런 생각을 더 자주 한다",
    a:{t:"지금 당장 해야 할 일이 뭐지?", v:"S"},
    b:{t:"나중에 어떤 일이 생길까?", v:"N"} },
  { axis:"TF", q:"칭찬을 들을 때 더 기분 좋은 말은",
    a:{t:"“와, 정말 잘했다! 대단한데?”", v:"T"},
    b:{t:"“고마워, 네가 있어서 좋았어”", v:"F"} },
  { axis:"JP", q:"하기로 했던 일이 갑자기 바뀌면 나는",
    a:{t:"좀 당황스럽고 마음이 불편하다", v:"J"},
    b:{t:"오히려 새로워서 재밌을 것 같다", v:"P"} }
];

/* =========================================================
   흥미 영역 — 주니어커리어넷(홀랜드 6유형)과 같은 어휘
   ========================================================= */
var INTEREST = {
  R:{ name:"실재형", sub:"손으로 만들고 몸으로 움직이는" },
  I:{ name:"탐구형", sub:"파고들어 알아내는" },
  A:{ name:"예술형", sub:"상상하고 표현하는" },
  S:{ name:"사회형", sub:"사람을 돕고 어울리는" },
  E:{ name:"진취형", sub:"이끌고 설득하는" },
  C:{ name:"관습형", sub:"정리하고 꼼꼼하게 하는" }
};

var TYPE_ORDER = ["ISTJ","ISFJ","INFJ","INTJ","ISTP","ISFP","INFP","INTP",
                  "ESTP","ESFP","ENFP","ENTP","ESTJ","ESFJ","ENFJ","ENTJ"];

/* ========================= 앱 로직 ========================= */
var idx = 0, answers = [], userName = "", inputLocked = false;

var $ = function(id){ return document.getElementById(id); };
function show(id){
  ["screen-start","screen-quiz","screen-result"].forEach(function(s){
    $(s).classList.toggle("hidden", s !== id);
  });
  window.scrollTo(0,0);
}

function renderQuestion(){
  var q = QUESTIONS[idx];
  var pct = Math.round(idx / QUESTIONS.length * 100);
  $("progText").textContent = (idx+1) + " / " + QUESTIONS.length;
  $("progPct").textContent = pct + "%";
  $("progFill").style.width = pct + "%";
  $("qNum").textContent = (idx+1) + "번";
  $("qText").textContent = q.q;
  $("textA").textContent = q.a.t;
  $("textB").textContent = q.b.t;
  $("btnBack").style.visibility = idx === 0 ? "hidden" : "visible";
}

function answer(which){
  /* 같은 자리에 곧바로 다음 문항이 뜨기 때문에, 빠른 더블탭(태블릿에서 흔함)이
     다음 문항을 읽지도 않고 자동으로 답해버리는 걸 막는다 */
  if (inputLocked) return;
  inputLocked = true;
  answers[idx] = which;
  if (idx < QUESTIONS.length - 1){ idx++; renderQuestion(); }
  else { renderResult(); show("screen-result"); }
  setTimeout(function(){ inputLocked = false; }, 350);
}

function score(){
  var c = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  for (var i=0;i<QUESTIONS.length;i++){
    var q = QUESTIONS[i], a = answers[i];
    if (a !== "a" && a !== "b") continue;   // 응답 없는 문항은 세지 않음
    c[ a === "a" ? q.a.v : q.b.v ]++;
  }
  return c;
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* 이름 끝 글자의 받침을 보고 은/는 을 고름 */
function josaEunNeun(name){
  if (!name) return "";
  var ch = name.charCodeAt(name.length - 1) - 0xAC00;
  if (ch < 0 || ch > 11171) return "\uB294";           // 한글이 아니면 '는'
  return (ch % 28) === 0 ? "\uB294" : "\uC740";        // 받침 없으면 '는', 있으면 '은'
}

function axisBar(key, c){
  var a = AXIS_INFO[key], L = c[a.l], R = c[a.r], total = L + R;
  var lw = total ? Math.round(L/total*100) : 50;
  var lWin = L >= R;
  return '<div class="axisrow">'
    + '<div class="axislabels">'
    +   '<span class="axisside' + (lWin?' on':'') + '"><b>' + a.l + '</b> ' + a.ln + ' · ' + L + '</span>'
    +   '<span class="axisside' + (lWin?'':' on') + '">' + R + ' · ' + a.rn + ' <b>' + a.r + '</b></span>'
    + '</div>'
    + '<div class="axisbar">'
    +   '<span class="' + (lWin?'win':'lose') + '" style="width:' + lw + '%"></span>'
    +   '<span class="' + (lWin?'lose':'win') + '" style="width:' + (100-lw) + '%"></span>'
    + '</div></div>';
}

function renderResult(){
  var c = score();
  var type = (c.E>=c.I?"E":"I") + (c.S>=c.N?"S":"N") + (c.T>=c.F?"T":"F") + (c.J>=c.P?"J":"P");
  var d = TYPES[type];
  var today = new Date();
  var dateStr = today.getFullYear() + "년 " + (today.getMonth()+1) + "월 " + today.getDate() + "일";
  var who = userName ? esc(userName) : "";

  var h = "";
  h += '<div style="text-align:center; margin-bottom:6px;">';
  h += '<div class="typebadge">' + type + '</div></div>';

  if (d){
    h += '<div style="text-align:center;"><div class="nick">' + (who ? who + josaEunNeun(userName) + ' ' : '') + d.nick + '</div></div>';
    h += '<p class="typedesc">' + d.desc + '</p>';
  } else {
    h += '<div style="text-align:center;"><div class="nick">' + (who ? who + '의 유형: ' : '') + type + '</div></div>';
    h += '<div class="draftbox">✏️ <b>' + type + ' 유형 설명은 아직 준비 중이에요.</b><br>'
       + '아래 네 가지 막대는 지금 바로 볼 수 있어요. 선생님이 곧 채워 넣을 거예요.</div>';
  }

  h += '<div class="disc">이 결과는 정식 심리검사가 아니라 나를 알아보는 <b>수업 활동</b>입니다.</div>';

  h += '<h3>나의 네 가지 방향</h3>';
  h += '<p class="lead" style="font-size:14px; margin-bottom:12px;">'
     + '막대가 한쪽으로 완전히 치우친 사람은 거의 없어요. 6:4처럼 비슷하면 <b>둘 다 가진 것</b>이랍니다.</p>';
  ["EI","SN","TF","JP"].forEach(function(k){ h += axisBar(k, c); });

  if (d){
    h += '<h3>내가 잘하는 것</h3><ul class="plain">';
    d.strengths.forEach(function(s){ h += '<li>' + s + '</li>'; });
    h += '</ul>';

    h += '<h3>내가 흥미를 느끼는 영역</h3><div class="chips">';
    d.interests.forEach(function(k){
      h += '<span class="chip i-' + k + '">' + INTEREST[k].name
         + ' <span class="sm">' + INTEREST[k].sub + '</span></span>';
    });
    h += '</div>';

    h += '<h3>이런 일도 있어요</h3>';
    h += '<p class="lead" style="font-size:14px; margin-bottom:10px;">'
       + '“너는 꼭 이 일을 해야 해”가 아니에요. 같은 직업이 여러 유형에 나오기도 해요. 그냥 구경해보세요.</p>';
    h += '<div class="joblist">';
    d.jobs.forEach(function(j){ h += '<span class="job">' + j + '</span>'; });
    h += '</div>';

    h += '<h3>이번 주에 해볼 만한 것</h3><div class="todo"><ul>';
    d.todo.forEach(function(t){ h += '<li>' + t + '</li>'; });
    h += '</ul></div>';

    h += '<h3>이런 걸 연습해보면 좋아요</h3>';
    h += '<div class="grow">' + d.grow + '</div>';
  }

  h += '<div class="closing"><b>기억해요.</b> 성격은 자라면서 얼마든지 바뀌고, '
     + '한 사람에게 어울리는 일은 하나가 아니에요. 오늘 결과는 <b>나를 알아가는 첫 걸음</b>일 뿐이에요.</div>';

  /* ---- 인쇄 전용: 손으로 채우는 칸 ---- */
  h += '<div class="print-only" style="margin-top:16px;">';
  h += '<h3>✍️ 내가 직접 써보기</h3>';
  h += '<p style="font-size:11pt; margin:6px 0 3px;">1. 위에 나온 일 중에서 제일 궁금한 것은?</p>';
  h += '<div class="wline"></div>';
  h += '<p style="font-size:11pt; margin:10px 0 3px;">2. 그 일에 대해 더 알고 싶은 것 세 가지</p>';
  h += '<div class="wline sm"></div><div class="wline sm"></div><div class="wline sm"></div>';
  h += '<p style="font-size:11pt; margin:10px 0 3px;">3. 이번 주에 실제로 해볼 한 가지</p>';
  h += '<div class="wline"></div>';
  h += '<p style="font-size:10pt; color:#475569; margin-top:12px;">'
     + '이름 ' + (who || '________') + ' &nbsp;·&nbsp; 날짜 ' + dateStr + '</p>';
  h += '</div>';

  $("resultBody").innerHTML = h;
  /* document.title은 HTML이 아니라 순수 텍스트라, innerHTML용으로 이스케이프한
     who가 아니라 원래 이름(userName)을 그대로 써야 한다 — 안 그러면 이름에
     &, <, > 가 들어있을 때 탭 제목에 "&gt;" 같은 엔티티 글자가 그대로 보인다 */
  document.title = (userName ? userName + " " : "") + type + " 성격유형 탐험 결과";
  /* 설명이 아직 없는 초안 유형은 인쇄해봐야 빈 종이가 나오므로 인쇄 버튼을 감춘다 */
  $("printRow").classList.toggle("hidden", !d);
}

/* ========================= 이벤트 ========================= */
$("btnStart").addEventListener("click", function(){
  userName = $("nameInput").value.trim();
  idx = 0; answers = []; inputLocked = false;
  renderQuestion(); show("screen-quiz");
});
$("nameInput").addEventListener("keydown", function(e){
  if (e.key === "Enter") $("btnStart").click();
});
$("choiceA").addEventListener("click", function(){ answer("a"); });
$("choiceB").addEventListener("click", function(){ answer("b"); });
$("btnBack").addEventListener("click", function(){
  if (idx > 0){ idx--; renderQuestion(); }
});
$("btnPrint").addEventListener("click", function(){ window.print(); });
$("btnAgain").addEventListener("click", function(){
  idx = 0; answers = []; inputLocked = false; $("nameInput").value = userName;
  document.title = "나를 알아보는 성격유형 탐험 · 진로 활동";
  show("screen-start");
});
</script>
